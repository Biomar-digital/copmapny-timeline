name: Notify requesters when a change is ready for review

# Fires when policies/pending.json changes (or manually). For each request that
# has moved to pending_review and hasn't been notified yet, it emails the
# requester via Brevo and marks the entry as notified so it isn't re-sent.
on:
  push:
    branches: [claude/confident-curie-gudwtz]
    paths: ["policies/pending.json"]
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/confident-curie-gudwtz
      - name: Send "ready for review" emails (Brevo)
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error
          KEY = os.environ.get("BREVO_API_KEY")
          if not KEY:
              print("No BREVO_API_KEY secret set — skipping email send.")
              raise SystemExit(0)
          APP = "https://globa-policies.marketing-70b.workers.dev"
          SENDER = {"name": "BioMar Policy Library", "email": "marketing@biomar.com"}
          path = "policies/pending.json"
          data = json.load(open(path))

          def send(to, title):
              html = (
                '<div style="font-family:Arial,Helvetica,sans-serif;max-width:560px;margin:0 auto;border:1px solid #e3e8ef;border-radius:10px;overflow:hidden">'
                '<div style="background:#1c4076;color:#fff;padding:14px 20px;font-weight:700">BioMar Policy Library</div>'
                '<div style="padding:20px 22px"><h2 style="margin:0 0 8px;color:#1c4076;font-size:18px">Your change is ready for review</h2>'
                f'<p style="margin:0 0 14px;color:#43607f;line-height:1.5">The change you requested on "{title}" has been made and is ready for your review. Open the library, check the document and either approve it or request another round.</p>'
                f'<p style="margin:18px 0 0"><a href="{APP}" style="background:#1c4076;color:#fff;text-decoration:none;padding:9px 16px;border-radius:8px;display:inline-block;font-weight:600">Open the library</a></p></div></div>')
              body = json.dumps({"sender": SENDER, "to": [{"email": to}],
                                 "subject": f"[BioMar Policy Library] Ready for your review — {title}",
                                 "htmlContent": html}).encode()
              req = urllib.request.Request("https://api.brevo.com/v3/smtp/email", data=body,
                  headers={"api-key": KEY, "Content-Type": "application/json", "Accept": "application/json"})
              try:
                  r = urllib.request.urlopen(req, timeout=30); print("sent to", to, "->", r.status)
              except urllib.error.HTTPError as e:
                  print("ERROR sending to", to, e.code, e.read().decode()[:300])

          changed = False
          for it in data:
              if it.get("status") == "pending_review" and not it.get("notified") and it.get("email"):
                  send(it["email"], it.get("title") or it.get("policy"))
                  it["notified"] = True
                  changed = True
          if changed:
              json.dump(data, open(path, "w"), indent=2); open(path, "a").write("\n")
              print("marked notified entries")
          PY
      - name: Persist notified flags
        run: |
          if [ -n "$(git status --porcelain policies/pending.json)" ]; then
            git config user.name "policy-bot"
            git config user.email "noreply@biomar.com"
            git add policies/pending.json
            git commit -m "Mark review notifications sent [skip ci]"
            git push
          fi
