name = "globa-policies"
compatibility_date = "2026-06-16"
main = "worker/index.js"

# The Worker (worker/index.js) gates every request with Basic Auth, then serves
# the generated policy library (docs/) via the ASSETS binding. run_worker_first
# makes the Worker run before assets so nothing is served without authentication.
[assets]
directory = "./docs"
binding = "ASSETS"
run_worker_first = true

# Accounts + sessions + notification events (two-role auth, signup/approval).
[[d1_databases]]
binding = "DB"
database_name = "policy-users"
database_id = "0b2578fc-06a3-426b-83a7-f8a8df25502a"

# Backend config for the feedback/request APIs.
# Secrets (set in the dashboard as *Secret*, NOT here): GH_TOKEN (contents
# read+write AND issues:write) and BREVO_API_KEY (email). Secrets survive git
# deploys; plaintext vars below are re-applied from this file on every deploy.
[vars]
GH_OWNER = "Biomar-digital"
GH_REPO = "copmapny-timeline"
GH_BRANCH = "claude/confident-curie-gudwtz"
# Email notifications via Brevo. NOTIFY_EMAIL is where admin alerts go; BREVO_FROM
# must be a verified Brevo sender on the authenticated biomar.com domain.
NOTIFY_EMAIL = "marketing@biomar.com"
BREVO_FROM = "BioMar Policy Library <marketing@biomar.com>"
